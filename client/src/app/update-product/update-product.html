<h2>Update Product</h2>

@if (loading) {
  <p>Loading...</p>
}

@if (!loading && product) {
  <form (ngSubmit)="onSubmit()" #f="ngForm">
    <div class="field">
      <label>ID (read-only)</label>
      <input type="number" [value]="product.id" readonly>
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" name="name" [(ngModel)]="product.name" maxlength="50" required>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea name="description" [(ngModel)]="product.description" maxlength="255"></textarea>
    </div>
    <div class="field">
      <label>Price</label>
      <input type="number" name="price" [(ngModel)]="product.price" step="0.01" required>
    </div>
    <div class="field">
      <label>Units</label>
      <input type="number" name="units" [(ngModel)]="product.units" required>
    </div>
    <button type="submit" [disabled]="!f.valid || submitting">Save Changes</button>
    @if (message) {
      <p [class.error]="isError">{{ message }}</p>
    }
  </form>
}
